<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #f5f6fa; color: #222; }

  header {
    background: #1e293b; color: #fff; padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 22px; }
  .cart-btn {
    background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px;
    border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
  }
  .cart-btn:hover { background: #0ea5e9; }

  .products {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px; padding: 24px; max-width: 1200px; margin: auto;
  }
  .card {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: 0.2s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #e2e8f0; }
  .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
  .card-body h3 { font-size: 17px; margin-bottom: 6px; }
  .card-body p { font-size: 13px; color: #64748b; margin-bottom: 10px; flex: 1; }
  .price { color: #16a34a; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
  .add-btn {
    background: #1e293b; color: #fff; border: none; padding: 10px;
    border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .add-btn:hover { background: #334155; }

  /* سلة */
  .cart-panel {
    position: fixed; top: 0; left: -400px; width: 360px; max-width: 90vw;
    height: 100%; background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,0.15);
    transition: 0.3s; z-index: 20; display: flex; flex-direction: column;
  }
  .cart-panel.open { left: 0; }
  .cart-header {
    padding: 16px; background: #1e293b; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
  .cart-items { flex: 1; overflow-y: auto; padding: 12px; }
  .cart-item {
    display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee;
    align-items: center;
  }
  .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
  .cart-item-info { flex: 1; font-size: 14px; }
  .cart-item-info strong { display: block; }
  .qty-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .qty-controls button {
    width: 24px; height: 24px; border: 1px solid #ccc; background: #fff;
    border-radius: 4px; cursor: pointer; font-weight: bold;
  }
  .remove-btn { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 18px; }

  .cart-footer { padding: 16px; border-top: 1px solid #eee; }
  .total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
  .checkout-btn {
    width: 100%; background: #16a34a; color: #fff; border: none;
    padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
  }
  .checkout-btn:hover { background: #15803d; }
  .empty { text-align: center; color: #94a3b8; padding: 40px 0; }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 15;
  }
  .overlay.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>🛍️ متجري</h1>
  <button class="cart-btn" onclick="toggleCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
</header>

<main class="products" id="products"></main>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<aside class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>سلة المشتريات</h2>
    <button onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="total"><span>المجموع:</span><span id="totalPrice">0 د.ع</span></div>
    <button class="checkout-btn" onclick="checkout()">إتمام الطلب عبر واتساب</button>
  </div>
</aside>

<script>
/* ============================================================
   ✏️ عدّل منتجاتك من هنا فقط
   ============================================================ */
const WHATSAPP_NUMBER = "9647700000000"; // ← ضع رقمك بصيغة دولية بدون +

const products = [
  {
    id: 1,
    name: "منتج أول",
    desc: "وصف قصير للمنتج",
    price: 15000,
    img: "https://via.placeholder.com/300x200?text=Product+1"
  },
  {
    id: 2,
    name: "منتج ثاني",
    desc: "وصف قصير للمنتج",
    price: 25000,
    img: "https://via.placeholder.com/300x200?text=Product+2"
  },
  {
    id: 3,
    name: "منتج ثالث",
    desc: "وصف قصير للمنتج",
    price: 8000,
    img: "https://via.placeholder.com/300x200?text=Product+3"
  }
];
/* ============================================================ */

let cart = JSON.parse(localStorage.getItem("cart") || "[]");

function renderProducts() {
  document.getElementById("products").innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="price">${p.price.toLocaleString()} د.ع</div>
        <button class="add-btn" onclick="addToCart(${p.id})">أضف إلى السلة</button>
      </div>
    </div>
  `).join("");
}

function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else {
    const p = products.find(x => x.id === id);
    cart.push({ ...p, qty: 1 });
  }
  saveCart(); renderCart();
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  saveCart(); renderCart();
}

function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart(); renderCart();
}

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

function renderCart() {
  const box = document.getElementById("cartItems");
  if (cart.length === 0) {
    box.innerHTML = '<div class="empty">السلة فارغة 🛒</div>';
  } else {
    box.innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.img}" alt="${i.name}">
        <div class="cart-item-info">
          <strong>${i.name}</strong>
          <span>${i.price.toLocaleString()} د.ع</span>
          <div class="qty-controls">
            <button onclick="changeQty(${i.id}, -1)">−</button>
            <span>${i.qty}</span>
            <button onclick="changeQty(${i.id}, 1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeItem(${i.id})">🗑️</button>
      </div>
    `).join("");
  }
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("totalPrice").textContent = total.toLocaleString() + " د.ع";
  document.getElementById("cartCount").textContent = count;
}

function toggleCart() {
  document.getElementById("cartPanel").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function checkout() {
  if (cart.length === 0) { alert("السلة فارغة!"); return; }
  let msg = "مرحباً، أريد طلب:%0A%0A";
  cart.forEach(i => { msg += `• ${i.name} × ${i.qty} = ${(i.price * i.qty).toLocaleString()} د.ع%0A`; });
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  msg += `%0Aالمجموع الكلي: ${total.toLocaleString()} د.ع`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
}

renderProducts(); renderCart();
</script>
</body>
</html>
